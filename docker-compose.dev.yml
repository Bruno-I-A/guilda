# Banco de desenvolvimento local. Em produção o Postgres fica na VPS
# (ver docker-compose.yml / README na Fase 4).
services:
  db:
    image: postgres:17-alpine
    container_name: guilda-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guilda
    ports:
      - "5432:5432"
    volumes:
      - guilda_pgdata_dev:/var/lib/postgresql/data
      - ./docker/dev/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guilda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  guilda_pgdata_dev:
